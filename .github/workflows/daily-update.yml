name: Daily catalog update
on:
  schedule:
    # Se ejecuta una vez al día a las 08:00 UTC (aprox 04:00-05:00 en Chile, dependiendo del horario de verano/invierno, sujeto a las colas de GitHub)
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-catalog
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Update catalog from public sources
        # A down portal must not skip the build. The script already keeps
        # going when one source fails; this covers an unexpected crash.
        continue-on-error: true
        run: npm run update:catalog

      - name: Commit catalog if changed
        run: |
          git config user.name "unportal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/catalog.js src/data/update-meta.json
          if git diff --staged --quiet; then
            echo "No catalog changes"
          else
            git commit -m "chore: daily catalog refresh ($(TZ=America/Santiago date +%F))"
            git push
          fi

      - name: Build static site
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
